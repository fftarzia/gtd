name: Build GTDdo Android Quick Capture APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android-quick-capture/**'
      - '.github/workflows/android-quick-capture.yml'
  push:
    paths:
      - 'android-quick-capture/**'
      - '.github/workflows/android-quick-capture.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out fork
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest ships with Android command-line tools. The upstream
      # setup-android action currently fails trying to install package 'tools'.
      - name: Install Android SDK 35
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          command -v sdkmanager
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK and run unit tests
        working-directory: android-quick-capture
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: gtddo-quick-capture-debug-apk
          path: android-quick-capture/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
